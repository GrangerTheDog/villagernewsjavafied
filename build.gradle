plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven {
				name = 'GeckoLib'
				url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
			}
		}
		filter { includeGroupAndSubgroups('com.geckolib') }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'TerraformersMC'
				url = 'https://maven.terraformersmc.com/releases/'
			}
		}
		filter { includeGroup('com.terraformersmc') }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"villagernewsjavafied" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// GeckoLib, for rendering the converted Bedrock geometry/animations.
	implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	// Molang interpreter. Only its parser + interpreter are used; javassist is
	// needed solely by mocha's bytecode compiler (MochaEngine/MolangCompiler),
	// so it's excluded here too - any accidental use of those fails in
	// runClient instead of only in a release jar.
	implementation("team.unnamed:mocha:3.0.1") {
		exclude group: "org.javassist"
	}
	include "team.unnamed:mocha:3.0.1"

	// Mod Menu, optional: shown with the converted add-on's icon when it's installed (see ModMenuIconMixin).
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:6.1.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.3"
}

// Let tests exercise client-side logic too (e.g. the Bedrock runtime against real add-on data).
sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('runConverter', JavaExec) {
	group = 'villagernewsjavafied'
	description = 'Runs the addon converter against dev/addon-src, writing output to dev/converted.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.javafied.villagernews.converter.ConverterCli'
	args = [
			"${project.projectDir}/dev/addon-src",
			"${project.projectDir}/dev/converted"
	]
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here, if ever needed.
	}
}
