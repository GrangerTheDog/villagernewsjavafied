# Builds the mod on every push and pull request. On main, a version that
# hasn't been released yet (gradle.properties' `version`) is released
# automatically: tag v<version>, with the jar attached.
#
# The build never sees the Villager News add-on: the jar holds only the
# mod's own code, and players convert their own copy of the add-on.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Read the mod's version
        id: version
        run: echo "version=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: villagernewsjavafied-${{ steps.version.outputs.version }}
          path: build/libs/*.jar

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: villagernewsjavafied-${{ needs.build.outputs.version }}
          path: jars

      - name: Release this version, unless it already is
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released - bump version in gradle.properties for a new release."
            exit 0
          fi
          gh release create "v$VERSION" "jars/villagernewsjavafied-$VERSION.jar" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Villager News: Javafied $VERSION" \
            --generate-notes \
            --notes "Minecraft 26.2 (Fabric). Needs Fabric API and GeckoLib, and your own copy of the Villager News add-on: this jar contains none of its content - the mod converts your copy the first time you start the game."
